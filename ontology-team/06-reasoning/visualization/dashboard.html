// ============================================================
// UTILITY COMPONENTS
// ============================================================

function Badge({ children, color='#475569' }) {
  return <span className="inline-block px-2 py-0.5 text-xs rounded" style={{ backgroundColor:color+'33', color, border:`1px solid ${color}55` }}>{children}</span>;
}
function Card({ children, className='', highlight=false }) {
  return <div className={`bg-slate-800 border ${highlight?'border-amber-500/50':'border-slate-700'} p-4 ${className}`}>{children}</div>;
}
function SectionTitle({ children }) {
  return <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wide mb-3 mt-6">{children}</h3>;
}
function StatusBadge({ status }) {
  const map = { COMPLETE:['#22c55e','완료'], IN_PROGRESS:['#f59e0b','진행중'], NOT_STARTED:['#64748b','미착수'], PENDING:['#64748b','대기'] };
  const [c,l] = map[status]||['#64748b',status];
  return <Badge color={c}>{l}</Badge>;
}
function BarChart({ items, maxVal }) {
  return <div className="space-y-1">{items.map(([label,val,color])=><div key={label} className="flex items-center gap-2"><span className="text-xs text-slate-400 w-36 truncate">{label}</span><div className="flex-1 bg-slate-700 h-5"><div className="h-5 flex items-center" style={{width:`${val/maxVal*100}%`,backgroundColor:(color||'#3b82f6')+'99'}}><span className="text-xs mono text-white pl-2">{typeof val==='number'?val.toLocaleString():val}</span></div></div></div>)}</div>;
}

// ============================================================
// TAB 1: PROJECT OPERATIONS
// ============================================================
function Tab1() {
  const [expandedPipe, setExpandedPipe] = useState(null);
  return (
    <div className="fade-in space-y-6">
      <SectionTitle>3 Bot 아키텍처</SectionTitle>
      <div className="grid grid-cols-3 gap-3">
        {BOTS.map(bot => (
          <Card key={bot.id}>
            <div className="text-xs mono mb-1" style={{color:bot.color}}>{bot.pipe}</div>
            <div className="text-base font-bold text-slate-100">{bot.name}</div>
            <div className="text-xs text-slate-400 mt-1">{bot.role}</div>
          </Card>
        ))}
      </div>

      <SectionTitle>파이프라인 구조</SectionTitle>
      <div className="space-y-3">
        {PIPES.map(pipe => {
          const isOpen = expandedPipe === pipe.id;
          const doneSteps = pipe.steps.filter(s=>s.done).length;
          const totalSteps = pipe.steps.length;
          const pct = totalSteps ? Math.round(doneSteps/totalSteps*100) : 0;
          return (
            <div key={pipe.id}>
              <button onClick={()=>setExpandedPipe(isOpen?null:pipe.id)}
                className="w-full text-left bg-slate-800 border border-slate-700 px-4 py-3 hover:bg-slate-750 transition-colors"
                style={{borderLeftWidth:'4px',borderLeftColor:pipe.color}}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <div>
                      <span className="text-sm font-bold text-slate-200">{pipe.name}</span>
                      <span className="text-xs text-slate-500 ml-2">{pipe.subtitle}</span>
                    </div>
                    <StatusBadge status={pipe.status}/>
                  </div>
                  <div className="flex items-center gap-3">
                    {totalSteps > 0 && <span className="text-xs mono text-slate-500">{doneSteps}/{totalSteps} ({pct}%)</span>}
                    <span className="text-xs text-slate-500">{isOpen?'▲':'▼'}</span>
                  </div>
                </div>
                {totalSteps > 0 && (
                  <div className="w-full bg-slate-700 h-1.5 mt-2 rounded">
                    <div className="h-1.5 rounded" style={{width:`${pct}%`,backgroundColor:pipe.color}}></div>
                  </div>
                )}
              </button>
              {isOpen && pipe.steps.length > 0 && (
                <div className="border border-t-0 border-slate-700 px-4 py-3 fade-in space-y-1" style={{backgroundColor:'#151d2e'}}>
                  {pipe.steps.map((step,i) => (
                    <div key={i} className="flex items-center gap-3 text-xs py-1">
                      <span className={`w-4 text-center ${step.done?'text-green-400':'text-slate-600'}`}>{step.done?'✓':'○'}</span>
                      <span className={step.done?'text-slate-300':'text-slate-500'}>{step.name}</span>
                      <span className="mono text-slate-600 ml-auto">{step.output}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TabLayerMap() {
  const [pipeFilter, setPipeFilter] = useState('ALL');
  const pipes = ['ALL', ...PIPES.map(p => p.name)];
  const filtered = pipeFilter === 'ALL' ? PIPE_LAYER_MAP : PIPE_LAYER_MAP.filter(row => row.pipe === pipeFilter);
  const layerLookup = Object.fromEntries(LAYERS.map(l => [l.num, l]));
  const totalClasses = LAYERS.reduce((sum, layer) => sum + layer.classes.length, 0);
  const flowNodes = [
    { layer:2, cls:'Article', label:'법령 조문', example:'RULE 제42조' },
    { layer:3, cls:'NormStatement', label:'규범명제', example:'NS-RULE42-0' },
    { layer:4, cls:'SafetyRequirement', label:'안전요구사항', example:'SR-FALL-001' },
    { layer:5, cls:'ChecklistItem', label:'체크리스트', example:'CI-DC13-001' },
    { layer:6, cls:'WorkplaceContext', label:'OHS 맥락', example:'사진 속 작업장' },
  ];

  const classBadge = (cls) => {
    const clean = cls.replace('★', '');
    const info = CLASS_KO_MAP[clean] || { ko: clean, meaning: '' };
    return (
      <span key={cls} className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-700 text-slate-200 border border-slate-600">
        <span className="mono text-[11px] text-cyan-300">{clean}</span>
        <span className="text-[11px] text-slate-400">{info.ko}</span>
      </span>
    );
  };

  return (
    <div className="fade-in space-y-6">
      <SectionTitle>Pipe 산출물 ↔ 7레이어 연결 지도</SectionTitle>
      <div className="grid grid-cols-4 gap-3">
        <Card highlight><div className="text-xs text-slate-500">대표 매핑 그룹</div><div className="text-2xl font-bold text-emerald-400 mt-1">{PIPE_LAYER_MAP.length}</div><div className="text-xs text-slate-500 mt-1">Pipe별 핵심 연결 묶음</div></Card>
        <Card><div className="text-xs text-slate-500">레이어</div><div className="text-2xl font-bold text-blue-400 mt-1">{LAYERS.length}</div><div className="text-xs text-slate-500 mt-1">L0~L6 전체</div></Card>
        <Card><div className="text-xs text-slate-500">클래스 한글 사전</div><div className="text-2xl font-bold text-amber-400 mt-1">{totalClasses}</div><div className="text-xs text-slate-500 mt-1">영문 ↔ 한글명</div></Card>
        <Card><div className="text-xs text-slate-500">핵심 허브</div><div className="text-2xl font-bold text-orange-400 mt-1">L4</div><div className="text-xs text-slate-500 mt-1">SafetyRequirement</div></Card>
      </div>

      <SectionTitle>대표 연결 흐름</SectionTitle>
      <Card>
        <div className="flex flex-wrap items-stretch gap-2">
          {flowNodes.map((node, i) => {
            const layer = layerLookup[node.layer];

            return (
              <Fragment key={node.cls}>
                <div className="flex-1 min-w-[150px] border border-slate-700 bg-slate-900 p-3" style={{borderTopWidth:'3px',borderTopColor:layer.color}}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="mono text-xs" style={{color:layer.color}}>L{node.layer}</span>
                    <span className="text-[11px] text-slate-500">{layer.name}</span>
                  </div>
                  <div className="text-sm font-semibold text-slate-100">{node.label}</div>
                  <div className="mono text-xs text-cyan-300 mt-1">{node.cls}</div>
                  <div className="text-xs text-slate-400 mt-1">{info.ko}</div>
                  <div className="text-[11px] text-slate-500 mt-2">{node.example}</div>
                </div>
                {i < flowNodes.length - 1 && (
                  <div className="hidden md:flex items-center text-slate-500 mono text-lg">→</div>
                )}
              </Fragment>
            );
          })}
        </div>
        <div className="text-xs text-slate-500 mt-3">법령 원문은 L2에 보존되고, L3에서 의무 문장으로 쪼개진 뒤, L4 SR 허브를 거쳐 L5 가이드 체크리스트와 L6 OHS 서비스 맥락으로 이어집니다.</div>
      </Card>

      <SectionTitle>Pipe별 산출물 매핑표</SectionTitle>
      <div className="flex flex-wrap gap-2 mb-3">
        {pipes.map(pipe => (
          <button key={pipe} onClick={()=>setPipeFilter(pipe)}

            {pipe === 'ALL' ? '전체' : pipe}

        ))}
      </div>
      <div className="overflow-x-auto border border-slate-700">
        <table className="w-full text-xs">
          <thead className="bg-slate-800 text-slate-400">

              <th className="text-left p-3 font-semibold">Layer</th>
              <th className="text-left p-3 font-semibold">클래스 한글 매칭</th>
              <th className="text-left p-3 font-semibold">저장·활용 목적</th>

          <tbody>
            {filtered.map((row, idx) => (
              <tr key={`${row.pipe}-${row.artifact}-${idx}`} className="border-t border-slate-700 bg-slate-900/60 align-top">
                <td className="p-3 w-44"><div className="font-semibold text-slate-200">{row.pipe}</div><div className="text-slate-500 mt-1">{row.step}</div></td>
                <td className="p-3 mono text-cyan-300 w-56">{row.artifact}</td>

                <td className="p-3 min-w-[320px]"><div className="flex flex-wrap gap-1.5">{row.classes.map(classBadge)}</div></td>
                <td className="p-3 text-slate-300 min-w-[220px]">{row.purpose}</td>
                <td className="p-3 text-slate-500 min-w-[200px]">{row.example}</td>
              </tr>

      <SectionTitle>7레이어 클래스 한글 사전</SectionTitle>
      <div className="space-y-3">
        {LAYERS.map(layer => (
          <Card key={layer.num}>

              <span className="mono text-xs px-2 py-1 rounded" style={{backgroundColor:layer.color+'22',color:layer.color}}>L{layer.num}</span>
              <div className="text-sm font-semibold text-slate-100">{layer.name}</div>
              <div className="text-xs text-slate-500">{layer.classes.length} classes</div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
              {layer.classes.map(cls => {
                const clean = cls.replace('★', '');
                const info = CLASS_KO_MAP[clean] || { ko: clean, meaning: '' };
                return (
                  <div key={cls} className="bg-slate-900 border border-slate-700 p-2">
                    <div className="flex items-center gap-2">

              })}

          </Card>
        ))}
      </div>

  );

                  <div className="flex flex-wrap gap-2">

        ))}

    </div>
  );
}

// TAB 3: DATA FLOW / PIPELINE
// ============================================================
function ArrowH() { return <svg width="24" height="12" viewBox="0 0 24 12" className="flex-shrink-0"><path d="M0 6h18m0 0l-4-4m4 4l-4 4" stroke="#475569" strokeWidth="1.5" fill="none"/></svg>; }
function Tab3() {

  const steps = [
    { title:'규칙 제42조', sub:'Article (L2)',

    { title:'NS-RULE42-0~5', sub:'NormStatement 6개 (L3)',
      json:'{\n  "identifier": "NS-RULE42-0",\n  "hasModality": "OBLIGATION",\n  "hasSubjectRole": "EMPLOYER",\n  "roleGuidance": "추락 위험이 있는 장소에서\\n  안전조치 의무를 부담하는 사업주",\n  "hasSanction": {\n    "criminal": { "violation_employer": "5년/5천만" },\n    "death": "7년/1억"\n  }\n}' },
    { title:'SR-FALL-001', sub:'SafetyRequirement (L4)',
      json:'{\n  "identifier": "SR-FALL-001",\n  "title": "추락방지 안전조치",\n  "requirementType": "PHYSICAL_PROTECTION",\n  "addressesHazard": ["FALL"],\n  "mandatedBy": ["NS-RULE42-0", ...],\n  "referencesArticle": ["제42조"]\n}' },
    { title:'CI-DC13-001', sub:'ChecklistItem (L5)',
      json:'{\n  "identifier": "CI-DC13-001",\n  "text": "비계 조립·해체 시 추락방지망 설치 확인",\n  "bindingForce": "MANDATORY",\n  "basedOn": "SR-FALL-001",\n  "sourceGuide": "D-C-13-2026"\n}' },

  return (
    <div className="fade-in space-y-6">
      <SectionTitle>파이프라인 카드</SectionTitle>
      <div className="grid grid-cols-3 gap-4">
        <Card>
          <div className="flex items-center gap-2 mb-3">
            <span className="text-sm font-bold text-green-400">Pipe-A</span>
            <StatusBadge status="COMPLETE"/>
          </div>
          <div className="text-xs text-slate-400 space-y-1">
            <div>법령 5종 → NS 1,229 → SR 626</div>
            <div>→ V1~V15 ALL PASS</div>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3">
            <div className="text-center"><div className="text-lg font-bold text-cyan-400">{META.totalNS.toLocaleString()}</div><div className="text-xs text-slate-500">NS</div></div>
            <div className="text-center"><div className="text-lg font-bold text-amber-400">{META.totalSR}</div><div className="text-xs text-slate-500">SR</div></div>
            <div className="text-center"><div className="text-lg font-bold text-blue-400">{META.totalArticles.toLocaleString()}</div><div className="text-xs text-slate-500">Articles</div></div>
          </div>
        </Card>
        <Card>
          <div className="flex items-center gap-2 mb-3">
            <span className="text-sm font-bold text-green-400">Pipe-B</span>
            <StatusBadge status="COMPLETE"/>
          </div>
          <div className="text-xs text-slate-400 space-y-1">
            <div>가이드 1,038/1,038 → CI/DT/WP/ES/DR</div>
            <div>→ V16~V30 ALL PASS</div>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3">
            <div className="text-center"><div className="text-lg font-bold text-green-400">{META.guidesCompleted}</div><div className="text-xs text-slate-500">Guides</div></div>
            <div className="text-center"><div className="text-lg font-bold text-blue-400">{META.totalCI.toLocaleString()}</div><div className="text-xs text-slate-500">CI</div></div>
            <div className="text-center"><div className="text-lg font-bold text-amber-400">{META.totalCISRMapping.toLocaleString()}</div><div className="text-xs text-slate-500">basedOn</div></div>
          </div>
        </Card>
        <Card>
          <div className="flex items-center gap-2 mb-3">
            <span className="text-sm font-bold text-green-400">Pipe-C</span>
            <StatusBadge status="COMPLETE"/>
          </div>
          <div className="text-xs text-slate-400 space-y-1">
            <div>교차검증 6 step + DB 적재</div>
            <div>→ V-C1~V-C10 ALL PASS</div>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-3">
            <div className="text-center"><div className="text-lg font-bold text-cyan-400">{PIPEC_DATA.srCoverage.rate}%</div><div className="text-xs text-slate-500">SR커버</div></div>
            <div className="text-center"><div className="text-lg font-bold text-amber-400">{PIPEC_DATA.basedonRestore.applied.toLocaleString()}</div><div className="text-xs text-slate-500">복원</div></div>
            <div className="text-center"><div className="text-lg font-bold text-blue-400">{META.guideInterLinks}</div><div className="text-xs text-slate-500">InterLink</div></div>
          </div>
        </Card>
      </div>

      <SectionTitle>데이터 체인 예시 (제42조 추적)</SectionTitle>
      <div className="flex gap-2 mb-4 flex-wrap">
        {steps.map((s,i) => (
          <Fragment key={i}>
            {i>0 && <ArrowH/>}
            <button onClick={() => setStep(i)}
              className={`px-3 py-2 text-xs border flex-shrink-0 transition-colors ${step===i?'bg-blue-500/20 border-blue-500/50 text-blue-300':'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-600'}`}>
              <div className="font-semibold">{s.title}</div>
              <div className="text-slate-500 mt-0.5">{s.sub}</div>
            </button>
          </Fragment>
        ))}
      </div>
      <Card><pre className="text-xs mono text-slate-300 bg-slate-900 p-3 border border-slate-700 overflow-x-auto">{steps[step].json}</pre></Card>
    </div>
  );
}

// ============================================================
// TAB 4: PIPE-B 결과
// ============================================================
function Tab4() {
  const dd = META.domainDetail || {};
  const domainOrder = ['A','B','C','D','E'];
  const p3 = META.phase3 || {};
  const bd = META.binding || {};

  return (
    <div className="fade-in space-y-6">
      <SectionTitle>Pipe-B 적재 결과 (1,038/1,038 가이드)</SectionTitle>

      <div className="grid grid-cols-3 gap-4">
        <Card highlight><div className="text-xs text-slate-500">적재 가이드</div><div className="text-2xl font-bold text-green-400 mt-1">{META.guidesCompleted}<span className="text-sm text-slate-500 font-normal"> / {META.guidesInventoried}</span></div><div className="text-xs text-slate-500 mt-1">{Math.round(META.guidesCompleted/META.guidesInventoried*100*10)/10}% 완료</div></Card>
        <Card highlight><div className="text-xs text-slate-500">ChecklistItem (CI)</div><div className="text-2xl font-bold text-blue-400 mt-1">{META.totalCI.toLocaleString()}</div><div className="text-xs text-slate-500 mt-1">5종 엔티티 중 핵심</div></Card>
        <Card highlight><div className="text-xs text-slate-500">ci_sr_mapping</div><div className="text-2xl font-bold text-amber-400 mt-1">{META.totalCISRMapping.toLocaleString()}</div><div className="text-xs text-slate-500 mt-1">basedOn 복원 포함</div></Card>
      </div>

      <SectionTitle>5종 엔티티</SectionTitle>
      <div className="grid grid-cols-5 gap-3">
        {[
          ['CI', META.totalCI, '#3b82f6'],
          ['DT', META.totalDT, '#10b981'],
          ['WP', META.totalWP, '#f59e0b'],
          ['ES', META.totalES, '#8b5cf6'],
          ['DR', META.totalDR, '#ef4444'],
        ].map(([name,cnt,color]) => (
          <Card key={name}><div className="text-xs text-slate-500">{name}</div><div className="text-xl font-bold mt-1" style={{color}}>{cnt.toLocaleString()}</div></Card>
        ))}
      </div>

      <SectionTitle>도메인별 가이드·CI 현황</SectionTitle>
      <div className="space-y-2">
        {domainOrder.map(cat => {
          const info = DOMAIN_INFO.find(d=>d.cat===cat);
          const d = dd[cat] || {guides:0,ci:0,mapped:0};
          const maxCI = Math.max(...domainOrder.map(c=>(dd[c]||{ci:0}).ci));
          return (
            <div key={cat} className="flex items-center gap-3">
              <span className="text-sm font-bold w-8 text-center" style={{color:info?.color}}>{cat}</span>

              <span className="text-xs mono text-slate-500 w-16">{d.guides}가이드</span>
              <div className="flex-1 bg-slate-700 h-5">
                <div className="h-5 flex items-center" style={{width:`${d.ci/maxCI*100}%`,backgroundColor:(info?.color||'#fff')+'99'}}>
                  <span className="text-xs mono text-white pl-2 font-bold">{d.ci.toLocaleString()} CI</span>
                </div>
              </div>
              <span className="text-xs mono text-slate-500 w-24">{(d.mapped||0).toLocaleString()} mapped</span>
            </div>
          );
        })}
      </div>

      <div className="grid grid-cols-2 gap-4">
        <div>
          <SectionTitle>binding_force 분포</SectionTitle>
          <div className="space-y-2">
            {Object.entries(bd).sort((a,b)=>b[1]-a[1]).map(([bf,cnt]) => {
              const color = bf==='MANDATORY'?'#ef4444':'#64748b';
              const total = Object.values(bd).reduce((s,v)=>s+v,0);
              return (
                <div key={bf} className="flex items-center gap-2">
                  <span className="text-xs w-28" style={{color}}>{bf}</span>
                  <div className="flex-1 bg-slate-700 h-5"><div className="h-5 flex items-center" style={{width:`${cnt/total*100}%`,backgroundColor:color+'99'}}><span className="text-xs mono text-white pl-2">{cnt.toLocaleString()}</span></div></div>
                  <span className="text-xs mono text-slate-500 w-12">{Math.round(cnt/total*100)}%</span>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <SectionTitle>SR Phase 3 필드 채움률</SectionTitle>
          <div className="space-y-2">
            {Object.entries(p3).sort((a,b)=>b[1]-a[1]).map(([field,cnt]) => (
              <div key={field} className="flex items-center gap-2">
                <span className="text-xs text-slate-400 w-40 truncate">{field.replace(/_/g,' ')}</span>
                <div className="flex-1 bg-slate-700 h-5"><div className="h-5 flex items-center" style={{width:`${cnt/626*100}%`,backgroundColor:'#22c55e99'}}><span className="text-xs mono text-white pl-2">{cnt}</span></div></div>
                <span className="text-xs mono text-slate-500 w-12">{Math.round(cnt/626*100)}%</span>
              </div>
            ))}
          </div>

      <SectionTitle>Hazard 카테고리별 SR 분포</SectionTitle>
      <div className="grid grid-cols-3 gap-2">
        {Object.entries(HAZARD_CATEGORIES).sort((a,b)=>b[1]-a[1]).map(([cat,cnt]) => (
          <div key={cat} className="flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-2">
            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{backgroundColor:HAZ_COLORS[cat]||'#475569'}}></span>
            <span className="text-xs text-slate-300 flex-1">{cat.replace(/_/g,' ')}</span>
            <span className="text-xs mono font-bold text-slate-200">{cnt}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// TAB 5: SR REGISTRY BROWSER
// ============================================================
function Tab5() {
  const [search, setSearch] = useState('');
  const [typeFilter, setTypeFilter] = useState('ALL');
  const [hazFilter, setHazFilter] = useState('ALL');
  const [sortBy, setSortBy] = useState('id');
  const [selectedSR, setSelectedSR] = useState(null);

  const types = useMemo(() => {
    const t = {};
    SR_REGISTRY.forEach(sr => { t[sr.tp]=(t[sr.tp]||0)+1; });
    return Object.entries(t).sort((a,b) => b[1]-a[1]);
  }, []);

  const hazTypes = useMemo(() => {
    const h = {};
    SR_REGISTRY.forEach(sr => (sr.haz||[]).forEach(hz => { h[hz]=(h[hz]||0)+1; }));
    return Object.entries(h).sort((a,b) => b[1]-a[1]);
  }, []);

  const filtered = useMemo(() => {
    let items = SR_REGISTRY;
    if (typeFilter!=='ALL') items = items.filter(sr => sr.tp===typeFilter);
    if (hazFilter!=='ALL') items = items.filter(sr => (sr.haz||[]).includes(hazFilter));
    if (search) { const q=search.toLowerCase(); items = items.filter(sr => sr.id.toLowerCase().includes(q)||sr.t.toLowerCase().includes(q)||sr.a.some(a=>a.includes(q))); }
    if (sortBy==='nsc') items=[...items].sort((a,b)=>b.nsc-a.nsc);
    else if (sortBy==='haz') items=[...items].sort((a,b)=>(b.haz||[]).length-(a.haz||[]).length);
    else items=[...items].sort((a,b)=>a.id.localeCompare(b.id));
    return items;
  }, [search, typeFilter, hazFilter, sortBy]);

  const withQuant = SR_REGISTRY.filter(sr=>sr.sq).length;

  return (
    <div className="fade-in space-y-4">
      <SectionTitle>SR 레지스트리 ({META.totalSR}개)</SectionTitle>
      <div className="grid grid-cols-4 gap-3">
        <Card><div className="text-xs text-slate-500">Total SR</div><div className="text-2xl font-bold text-amber-400">{META.totalSR}</div></Card>
        <Card><div className="text-xs text-slate-500">CI 연결 SR</div><div className="text-2xl font-bold text-green-400">{PIPEC_DATA.srCoverage.covered}</div><div className="text-xs text-slate-500">{PIPEC_DATA.srCoverage.rate}% 커버</div></Card>
        <Card><div className="text-xs text-slate-500">정량적 기준 보유</div><div className="text-2xl font-bold text-cyan-400">{withQuant}</div><div className="text-xs text-slate-500">{Math.round(withQuant/META.totalSR*100)}%</div></Card>
        <Card><div className="text-xs text-slate-500">벌칙규칙</div><div className="text-2xl font-bold text-red-400">{META.penaltyRulesWithSanction}</div><div className="text-xs text-slate-500">/ {META.totalPenaltyRules} ({Math.round(META.penaltyRulesWithSanction/META.totalPenaltyRules*100)}% 제재 연결)</div></Card>
      </div>

      <Card>
        <div className="text-xs text-slate-500 mb-2">타입별 분포</div>
        <div className="flex h-6 w-full overflow-hidden rounded">
          {types.map(([tp,cnt]) => <div key={tp} style={{width:`${cnt/META.totalSR*100}%`,backgroundColor:TYPE_COLORS[tp]||'#475569'}} className="flex items-center justify-center text-xs text-white font-bold overflow-hidden" title={`${tp}: ${cnt}`}>{cnt>=15?cnt:''}</div>)}
        </div>
        <div className="flex flex-wrap gap-2 mt-2">
          {types.map(([tp,cnt]) => <button key={tp} onClick={()=>setTypeFilter(typeFilter===tp?'ALL':tp)} className={`text-xs px-2 py-0.5 border rounded transition-colors ${typeFilter===tp?'bg-slate-600 border-slate-500 text-white':'border-slate-700 text-slate-400 hover:border-slate-500'}`}><span className="inline-block w-2 h-2 rounded-full mr-1" style={{backgroundColor:TYPE_COLORS[tp]}}></span>{tp.replace(/_/g,' ')} ({cnt})</button>)}
        </div>
      </Card>

      <div className="flex gap-3 items-center flex-wrap">
        <input type="text" placeholder="SR ID, 제목, 조문 검색..." value={search} onChange={e=>setSearch(e.target.value)} className="flex-1 min-w-[200px] bg-slate-800 border border-slate-600 text-sm text-slate-200 px-3 py-1.5 focus:outline-none focus:border-blue-500"/>
        <select value={hazFilter} onChange={e=>setHazFilter(e.target.value)} className="bg-slate-800 border border-slate-600 text-xs text-slate-200 px-2 py-1.5">
          <option value="ALL">Hazard: 전체</option>
          {hazTypes.map(([h,c])=><option key={h} value={h}>{h.replace(/_/g,' ')} ({c})</option>)}
        </select>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-slate-800 border border-slate-600 text-xs text-slate-200 px-2 py-1.5"><option value="id">ID 순</option><option value="nsc">NS 내림차순</option><option value="haz">Hazard 내림차순</option></select>
        <span className="text-xs text-slate-500">{filtered.length}건</span>
      </div>

      <div className="overflow-x-auto max-h-[500px] overflow-y-auto">
        <table className="w-full text-xs border-collapse">
          <thead className="sticky top-0 bg-slate-900 z-10">
            <tr className="text-slate-500 border-b border-slate-700">
              <th className="text-left p-2 w-40">SR ID</th>
              <th className="text-left p-2">제목</th>
              <th className="text-left p-2 w-28">타입</th>
              <th className="text-left p-2 w-24">Hazard</th>
              <th className="text-center p-2 w-14">NS</th>
              <th className="text-center p-2 w-14">Bind</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(sr => {
              const isSelected=selectedSR===sr.id;
              const penalty = sr.a[0] ? PENALTY_ROUTES[sr.a[0]] : null;
              return (
                <Fragment key={sr.id}>
                  <tr className={`border-b border-slate-800 cursor-pointer hover:bg-slate-800/50 ${isSelected?'bg-slate-700/30':''}`} onClick={()=>setSelectedSR(isSelected?null:sr.id)}>
                    <td className="p-2 mono text-slate-300 font-semibold">{sr.id}</td>
                    <td className="p-2 text-slate-300">{sr.t}</td>
                    <td className="p-2"><span className="text-xs px-1.5 py-0.5 rounded" style={{backgroundColor:(TYPE_COLORS[sr.tp]||'#475569')+'22',color:TYPE_COLORS[sr.tp]||'#94a3b8'}}>{sr.tp.replace(/_/g,' ')}</span></td>
                    <td className="p-2">{(sr.haz||[]).map(h=><span key={h} className="inline-block w-2 h-2 rounded-full mr-1" style={{backgroundColor:HAZ_COLORS[h]||'#475569'}} title={h}></span>)}</td>
                    <td className="p-2 text-center text-cyan-400 font-bold">{sr.nsc}</td>
                    <td className="p-2 text-center"><span className={`text-xs ${sr.bf==='MANDATORY'?'text-red-400':'text-slate-500'}`}>{sr.bf==='MANDATORY'?'필수':'권고'}</span></td>
                  </tr>
                  {isSelected && (
                    <tr><td colSpan={6} className="p-0"><div className="bg-slate-900 border-l-2 border-blue-500 p-3 fade-in space-y-2">
                      <div className="text-xs text-slate-400"><span className="text-slate-500">조문:</span> {sr.a.join(', ')}</div>
                      <div className="text-xs text-slate-400"><span className="text-slate-500">Hazard:</span> {(sr.haz||[]).map(h=><Badge key={h} color={HAZ_COLORS[h]||'#475569'}>{h}</Badge>)}</div>
                      <div className="text-xs text-slate-400"><span className="text-slate-500">정량기준:</span> {sr.sq?<Badge color="#22c55e">있음</Badge>:<span className="text-slate-600">없음</span>}</div>
                      {penalty && penalty.p && penalty.cr && (
                        <div className="mt-2 grid grid-cols-3 gap-2">
                          <div className="border border-orange-500/40 bg-orange-500/5 p-2">
                            <div className="text-xs text-orange-400 font-semibold">사업주 위반</div>
                            <div className="text-xs mono mt-1 text-orange-300">{PENALTY_LABELS[penalty.cr[0]]||penalty.cr[0]||'—'}</div>
                          </div>
                          <div className="border border-red-500/40 bg-red-500/5 p-2">
                            <div className="text-xs text-red-400 font-semibold">도급인 위반</div>
                            <div className="text-xs mono mt-1 text-red-300">{PENALTY_LABELS[penalty.cr[1]]||penalty.cr[1]||'—'}</div>
                          </div>
                          <div className="border border-red-800/60 bg-red-900/10 p-2">
                            <div className="text-xs text-red-600 font-semibold">사망사고</div>
                            <div className="text-xs mono mt-1 text-red-400">{PENALTY_LABELS[penalty.cr[2]]||penalty.cr[2]||'—'}</div>
                          </div>
                        </div>
                      )}
                    </div></td></tr>
                  )}
                </Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============================================================
// TAB 6: PIPE-C 교차검증
// ============================================================
function Tab6() {
  const pc = PIPEC_DATA;
  const auditDS = pc.basedonAudit.domainStats || {};
  const restoreDS = pc.basedonRestore.domainStats || {};
  const domainOrder = ['A','B','C','D','E'];

  return (
    <div className="fade-in space-y-6">

function FileTreeNode({ node, depth=0 }) {
  const [open, setOpen] = useState(depth<2);
  const isDir = node.type==='dir';
  const hasChildren = isDir && node.children && node.children.length>0;
  const isEmpty = isDir && (!node.children || node.children.length===0);
  return (
    <div>
      <div className="flex items-center gap-1 py-0.5 hover:bg-slate-800/50 cursor-pointer" style={{paddingLeft:`${depth*16+4}px`}} onClick={()=>isDir&&setOpen(!open)}>
        {isDir ? <span className="text-xs text-slate-500 w-4">{open?'▼':'▶'}</span> : <span className="text-xs w-4"></span>}
        <span className={`text-xs ${isDir?'text-blue-400':'text-slate-300'}`}>{isDir?'📁':'📄'} {node.name}</span>
        {node.note && <span className="text-xs text-slate-600 ml-2">{node.note}</span>}
        {node.size && <span className="text-xs text-slate-600 ml-2 mono">{node.size}</span>}
        {isEmpty && <span className="text-xs text-slate-700 ml-2">(비어있음)</span>}
      </div>
      {open && hasChildren && node.children.map((child,i)=><FileTreeNode key={i} node={child} depth={depth+1}/>)}
    </div>
  );
}

      </div>

      <div className="grid grid-cols-2 gap-4">
        <div>
          <SectionTitle>법령별 조문 분포</SectionTitle>
          <div className="space-y-1">
            {Object.entries(aby).sort((a,b)=>b[1]-a[1]).map(([law,cnt]) => {
              const maxCnt = Math.max(...Object.values(aby));
              const colors = {RULE:'#3b82f6',ENFORCE:'#10b981',OSHA:'#f59e0b',DECREE:'#8b5cf6',SADA:'#ef4444'};
              return <div key={law} className="flex items-center gap-2"><span className="text-xs mono text-slate-400 w-16">{law}</span><div className="flex-1 bg-slate-700 h-4"><div className="h-4 flex items-center" style={{width:`${cnt/maxCnt*100}%`,backgroundColor:(colors[law]||'#475569')+'99'}}><span className="text-xs mono text-white pl-1">{cnt}</span></div></div></div>;
            })}
          </div>
        </div>
        <div>
          <SectionTitle>SR 타입별 분포</SectionTitle>
          <div className="space-y-1">
            {typeEntries.map(([tp,cnt]) => {
              const maxCnt = typeEntries[0][1];
              return <div key={tp} className="flex items-center gap-2"><span className="text-xs text-slate-400 w-32 truncate">{tp.replace(/_/g,' ')}</span><div className="flex-1 bg-slate-700 h-4"><div className="h-4 flex items-center" style={{width:`${cnt/maxCnt*100}%`,backgroundColor:(TYPE_COLORS[tp]||'#475569')+'99'}}><span className="text-xs mono text-white pl-1">{cnt}</span></div></div></div>;
            })}
          </div>
        </div>
      </div>

      <SectionTitle>도메인별 가이드 현황</SectionTitle>
      <div className="space-y-2">
        {DOMAIN_INFO.map(d => {
          const cnt = (META.domainCounts||{})[d.cat]||0;
          const maxCnt = Math.max(...Object.values(META.domainCounts||{}));
          return (
            <div key={d.cat} className="flex items-center gap-3">
              <span className="text-sm font-bold w-8 text-center" style={{color:d.color}}>{d.cat}</span>
              <span className="text-xs text-slate-400 w-32">{d.label}</span>
              <div className="flex-1 bg-slate-700 h-5"><div className="h-5 flex items-center" style={{width:`${cnt/maxCnt*100}%`,backgroundColor:d.color+'99'}}><span className="text-xs mono text-white pl-2 font-bold">{cnt}</span></div></div>
              <span className="text-xs text-slate-500 w-20">가이드</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
const TABS = [
  { id:'ops', label:'프로젝트 운영' },
  { id:'layer-map', label:'Pipe↔7레이어 맵' },
  { id:'layers', label:'7레이어' },
  { id:'flow', label:'데이터 흐름' },
  { id:'pipeb', label:'Pipe-B 결과' },
  { id:'registry', label:'SR 레지스트리' },
  { id:'pipec', label:'Pipe-C 교차검증' },
  { id:'faceted', label:'Faceted·OHS' },
  { id:'audit', label:'품질 감사' },
  { id:'files', label:'파일 탐색기' },
  { id:'stats', label:'누적 현황' },
];

function App() {
  const [tab, setTab] = useState('ops');
  return (
    <div className="min-h-screen bg-slate-900 text-slate-100">
      <header className="border-b border-slate-700 bg-slate-900/95 sticky top-0 z-50">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div>
            <h1 className="text-base font-bold text-slate-100 tracking-tight">KOSHA Ontology Dashboard</h1>
            <div className="text-xs text-slate-500 mt-0.5">산업안전보건 법령 온톨로지 · 7-Layer · 3 Pipelines + OHS · {META.totalSR} SR · {META.totalCI.toLocaleString()} CI · {META.guidesCompleted} Guides · {META.totalTables || 23} Tables</div>
            {META.axiom100pct && <div className="text-xs text-emerald-500/80 mt-0.5">정석 OWL DL {META.axiom100pct.orthodoxScore} · SWRL {META.axiom100pct.swrlImpFormal} · Restriction {META.axiom100pct.owlRestriction} · AsymmetricProp {META.axiom100pct.owlAsymmetricProperty} · NLH {META.axiom100pct.nlhCategory} · vetted disjoint {META.axiom100pct.shaclVettedDisjoint.toLocaleString()} · Gate3 PASS</div>}
          </div>
          <div className="text-xs mono text-slate-600">v3.1 / 2026-05-28</div>
        </div>
        <div className="max-w-7xl mx-auto px-4 flex gap-0 overflow-x-auto">
          {TABS.map(t => <button key={t.id} onClick={()=>setTab(t.id)} className={`px-4 py-2 text-sm border-b-2 transition-colors whitespace-nowrap ${tab===t.id?'border-blue-500 text-blue-400':'border-transparent text-slate-500 hover:text-slate-300'}`}>{t.label}</button>)}
        </div>
      </header>
      <main className="max-w-7xl mx-auto px-4 py-6">
        {tab==='ops' && <Tab1/>}
        {tab==='layer-map' && <TabLayerMap/>}
        {tab==='layers' && <Tab2/>}
        {tab==='flow' && <Tab3/>}
        {tab==='pipeb' && <Tab4/>}
        {tab==='registry' && <Tab5/>}
        {tab==='pipec' && <Tab6/>}
        {tab==='faceted' && <TabFaceted/>}
        {tab==='audit' && <Tab7/>}
        {tab==='files' && <Tab8/>}
        {tab==='stats' && <Tab9/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
