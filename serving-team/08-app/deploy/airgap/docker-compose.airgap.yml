# Air-gap 배포용 compose — build 없음(이미지는 로컬에서 빌드 후 docker save → 서버 docker load).
# PG는 서버에 이미 존재(외부). ChromaDB는 업로드한 디렉토리를 bind-mount.
# 사용: 같은 폴더에 .env 작성 후  ->  docker compose -f docker-compose.airgap.yml up -d
name: ohs                              # Docker Desktop 그룹명(=compose 프로젝트, 소문자만). 컨테이너는 ohs>backend·frontend로 표시.
services:
  backend:
    image: ohs-backend:airgap          # build: 없음 — docker load로 미리 적재된 이미지 사용
    container_name: ohs-backend
    restart: unless-stopped
    env_file: [.env]                   # OPENAI_API_KEY, DATABASE_URL, (옵션) OHS_ENABLE_*
    environment:
      - FUSEKI_ENABLED=false           # 서빙 경로는 PG materialized → Fuseki 컨테이너 불요
      - OHS_SHARED_REFERENCE=/app/shared/reference   # canonical_vocab SSOT 위치(아래 mount)
      - OHS_SKIP_STARTUP_INDEX=true    # legacy article/guide 인덱스 빌드 생략(기동 빠르게). 4패널 무관.
    extra_hosts:
      - "host.docker.internal:host-gateway"   # DATABASE_URL이 host.docker.internal일 때 사용
    volumes:
      # 업로드·압축해제한 ChromaDB(967MB) 디렉토리를 컨테이너 /app/data/chromadb로 bind-mount.
      - ${CHROMADB_HOST_DIR:?set CHROMADB_HOST_DIR in .env}:/app/data/chromadb
      # shared/reference (canonical_vocab.py + JSON) — 코드가 런타임에 import. repo의 shared/reference.
      - ${SHARED_REF_HOST_DIR:?set SHARED_REF_HOST_DIR in .env}:/app/shared/reference:ro
    ports:
      - "127.0.0.1:8000:8000"          # 외부에 직접 노출 안 함(프론트 nginx가 /api 프록시)
    networks: [ohs-network]
    # ── 기존 PG가 'docker 네트워크에만' 있고 host 포트 미publish면, 아래 주석을 풀어
    #    그 네트워크에 backend를 붙이고 .env의 DATABASE_URL을 컨테이너명으로 지정한다.
    #   networks: [ohs-network, kosha-shared]

  frontend:
    image: ohs-frontend:airgap
    container_name: ohs-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"              # 개인서버 외부 접근. 리버스프록시 뒤면 127.0.0.1:3000 권장.
    volumes:
      # 조문 만화 카드 WebP(667장 ~37MB) — 이미지에 굽지 않는다(chromadb·shared/reference 패턴).
      # 생성: backend/scripts/build_cartoon_assets.py → frontend/public/cartoons.
      # 로컬 스택은 .env에 CARTOONS_HOST_DIR=<repo>/serving-team/08-app/frontend/public/cartoons
      - ${CARTOONS_HOST_DIR:?set CARTOONS_HOST_DIR in .env}:/usr/share/nginx/html/cartoons:ro
    depends_on: [backend]
    networks: [ohs-network, edge-net]    # edge-net: 공용 edge nginx(랜딩 :80)가 /ohs/를 이 프론트로 프록시

networks:
  ohs-network:
    driver: bridge
  edge-net:
    external: true                       # 최초 1회: docker network create edge-net (edge/와 공유)
  # 기존 PG 네트워크 사용 시 주석 해제(이름은 서버의 실제 네트워크로):
  # kosha-shared:
  #   external: true
