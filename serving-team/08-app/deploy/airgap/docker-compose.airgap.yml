# Air-gap 배포용 compose — build 없음(이미지는 로컬에서 빌드 후 docker save → 서버 docker load).
# PG는 서버에 이미 존재(외부). ChromaDB는 업로드한 디렉토리를 bind-mount.
# 사용: 같은 폴더에 .env 작성 후  ->  docker compose -f docker-compose.airgap.yml up -d
services:
  backend:
    image: ohs-backend:airgap          # build: 없음 — docker load로 미리 적재된 이미지 사용
    container_name: ohs-backend
    restart: unless-stopped
    env_file: [.env]                   # OPENAI_API_KEY, DATABASE_URL, (옵션) OHS_ENABLE_*
    environment:
      - FUSEKI_ENABLED=false           # 서빙 경로는 PG materialized → Fuseki 컨테이너 불요
    extra_hosts:
      - "host.docker.internal:host-gateway"   # DATABASE_URL이 host.docker.internal일 때 사용
    volumes:
      # 업로드·압축해제한 ChromaDB(967MB) 디렉토리를 컨테이너 /app/data/chromadb로 bind-mount.
      - ${CHROMADB_HOST_DIR:?set CHROMADB_HOST_DIR in .env}:/app/data/chromadb
    ports:
      - "127.0.0.1:8000:8000"          # 외부에 직접 노출 안 함(프론트 nginx가 /api 프록시)
    networks: [ohs-network]
    # ── 기존 PG가 'docker 네트워크에만' 있고 host 포트 미publish면, 아래 주석을 풀어
    #    그 네트워크에 backend를 붙이고 .env의 DATABASE_URL을 컨테이너명으로 지정한다.
    #   networks: [ohs-network, kosha-shared]

  frontend:
    image: ohs-frontend:airgap
    container_name: ohs-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"              # 개인서버 외부 접근. 리버스프록시 뒤면 127.0.0.1:3000 권장.
    depends_on: [backend]
    networks: [ohs-network]

networks:
  ohs-network:
    driver: bridge
  # 기존 PG 네트워크 사용 시 주석 해제(이름은 서버의 실제 네트워크로):
  # kosha-shared:
  #   external: true
