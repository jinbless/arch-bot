# edge 사이트 — localhost/ 랜딩페이지(정적) + 서비스 경로 라우팅.
# 랜딩은 /usr/share/nginx/html(index.html). 카드 클릭 → 각 서비스로 이동(html의 SERVICES에서 URL 지정).
#  [노트북 모드]   카드가 각 서비스 포트(:3000 등)로 직접 링크 → 아래 proxy_pass(/ohs/…)는 미사용.
#  [서버 단일 :80] 카드 url을 /ohs/ 처럼 경로로 바꾸면 아래 proxy_pass 사용(프론트 base=/<prefix>/ 재빌드 필요).
# resolver+변수로 런타임 DNS 해석 → ohs-frontend가 늦게 떠도 edge는 안 죽음(Docker 임베디드 DNS).
# 다른 서비스 추가 시: location 블록 복제 → prefix·upstream 변경. /api 충돌 시 서비스별 prefix(/svcA/api) 권장.
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=30s;
    client_max_body_size 20m;                 # 사진 업로드 여유
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 랜딩페이지(정적) — localhost/ → 서비스 선택 화면 ──
    root /usr/share/nginx/html;
    index index.html;
    location = / { try_files /index.html =404; }

    # ── [서버 단일 :80 모드] 서비스 경로 라우팅 (프론트 base=/<prefix>/ 재빌드 시 사용) ──
    location /ohs/          { set $ohs http://ohs-frontend:80; proxy_pass $ohs$request_uri; }
    location /api/          { set $ohs http://ohs-frontend:80; proxy_pass $ohs$request_uri; }
    location /articles-pdf/ { set $ohs http://ohs-frontend:80; proxy_pass $ohs$request_uri; }

    # ── for-ceo (기초노동질서AI) — Next.js Node 서버(:3000), basePath=/for-ceo ──
    location /for-ceo       { set $forceo http://for-ceo-frontend:3000; proxy_pass $forceo$request_uri; proxy_http_version 1.1; }

    # 랜딩 정적 에셋 fallback (favicon 등)
    location / { try_files $uri /index.html; }
}
