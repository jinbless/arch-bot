server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ★ no-cache는 server 레벨에 둔다 — location /ohs에만 두면 SPA 라우트(/ohs/result/…)가
    #   try_files의 /index.html **internal redirect로 location을 재매칭**하면서 헤더를 잃는다
    #   (실사고 2026-08-09: 결과 페이지만 휴리스틱 캐시로 옛 번들이 살아남았다).
    #   자산(/ohs/assets)은 자기 add_header(immutable)가 이걸 대체하므로 영향 없다.
    add_header Cache-Control "no-cache";

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # /ohs/assets → /usr/share/nginx/html/assets 매핑
    location /ohs/assets {
        alias /usr/share/nginx/html/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /ohs 경로로 SPA 서빙 — no-cache는 server 레벨에서 상속받는다(위 주석 참조).
    # 여기에 add_header를 다시 쓰면 안 된다: location에 add_header가 하나라도 있으면
    # server 레벨 상속이 통째로 꺼지는 nginx 규칙 때문에 오히려 사고 표면이 넓어진다.
    location /ohs {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 루트 접속 시 /ohs로 리다이렉트
    location = / {
        return 301 /ohs/;
    }

    # API 프록시
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # PDF 원문 파일 프록시
    location /articles-pdf/ {
        proxy_pass http://backend:8000/articles-pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
