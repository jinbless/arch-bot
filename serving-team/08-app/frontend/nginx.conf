server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # /ohs/assets → /usr/share/nginx/html/assets 매핑
    location /ohs/assets {
        alias /usr/share/nginx/html/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /ohs 경로로 SPA 서빙
    # ★ index.html은 no-cache — Cache-Control이 없으면 브라우저가 휴리스틱 캐시로
    #   옛 번들을 재검증 없이 계속 쓴다(2026-08 배포 후 흐름 패널이 안 보이던 원인).
    #   해시 자산(/ohs/assets)은 위에서 1y immutable이므로 index만 재검증하면 충분하다.
    location /ohs {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 루트 접속 시 /ohs로 리다이렉트
    location = / {
        return 301 /ohs/;
    }

    # API 프록시
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # PDF 원문 파일 프록시
    location /articles-pdf/ {
        proxy_pass http://backend:8000/articles-pdf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
