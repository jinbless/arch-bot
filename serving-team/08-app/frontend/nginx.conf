server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ★ no-cache는 server 레벨에 둔다 — location /ohs에만 두면 SPA 라우트(/ohs/result/…)가
    #   try_files의 /index.html **internal redirect로 location을 재매칭**하면서 헤더를 잃는다
    #   (실사고 2026-08-09: 결과 페이지만 휴리스틱 캐시로 옛 번들이 살아남았다).
    #   자산(/ohs/assets)은 자기 add_header(immutable)가 이걸 대체하므로 영향 없다.
    add_header Cache-Control "no-cache";

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # /ohs/assets → /usr/share/nginx/html/assets 매핑
    location /ohs/assets {
        alias /usr/share/nginx/html/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 조문 만화 카드(667장, ~37MB) — 이미지에 굽지 않고 bind-mount(CARTOONS_HOST_DIR)로 서빙.
    # 파일명에 콘텐츠 해시(NNN.<해시8>.webp)가 있어 immutable 안전 — /ohs/assets와 동일 패턴.
    # (add_header가 있는 location이라 server 레벨 no-cache 상속이 꺼지는 게 **의도**다)
    location /ohs/cartoons {
        alias /usr/share/nginx/html/cartoons;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /ohs 경로로 SPA 서빙 — no-cache는 server 레벨에서 상속받는다(위 주석 참조).
    # 여기에 add_header를 다시 쓰면 안 된다: location에 add_header가 하나라도 있으면
    # server 레벨 상속이 통째로 꺼지는 nginx 규칙 때문에 오히려 사고 표면이 넓어진다.
    location /ohs {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 루트 접속 시 /ohs로 리다이렉트
    location = / {
        return 301 /ohs/;
    }

    # API 프록시
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # (제거됨 2026-08-12) /articles-pdf/ 프록시 — 백엔드에 대응 라우트가 없는 죽은 경로였다.
    # edge(deploy/server/edge/conf.d/ohs.conf)의 동일 블록은 별도 정리(edge 재시작 리스크 분리).
}
